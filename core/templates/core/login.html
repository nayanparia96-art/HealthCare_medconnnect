{% extends 'core/base.html' %}
{% load static %}

{% block title %}Login - MEDCONNECT{% endblock %}

{% block content %}
<div class="login-hero">
    <div class="login-overlay"></div>
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <i class="fas fa-sign-in-alt bounce-in"></i>
                <h2>Welcome Back</h2>
                <p>Access your healthcare dashboard</p>
            </div>

            {% if error %}
            <div class="alert alert-danger slide-up">
                <i class="fas fa-exclamation-circle"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="post" class="auth-form">
                {% csrf_token %}
                <div class="form-group slide-left">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group slide-right" style="animation-delay: 0.2s;">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-primary bounce-in" style="animation-delay: 0.4s;">Login</button>
            </form>

            <div class="auth-footer fade-in" style="animation-delay: 0.6s;">
                <p>Don't have an account? <a href="/register/">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
