<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#E8F4F8" stroke="#667eea" stroke-width="2"/>
  
  <!-- Medical Cross (Primary) -->
  <g fill="#667eea">
    <!-- Vertical bar -->
    <rect x="90" y="60" width="20" height="80" rx="3"/>
    <!-- Horizontal bar -->
    <rect x="60" y="90" width="80" height="20" rx="3"/>
  </g>
  
  <!-- Heartbeat line (accent) -->
  <g stroke="#764ba2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="40,130 50,130 55,120 60,130 65,125 70,130 80,130"/>
  </g>
  
  <!-- Pulse dots -->
  <circle cx="40" cy="130" r="2" fill="#764ba2"/>
  <circle cx="80" cy="130" r="2" fill="#764ba2"/>
  
  <!-- Text: MEDCONNECT -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    MEDCONNECT
  </text>
</svg>